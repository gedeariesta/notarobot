<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Specimen sheet</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #1F3CFF; --paper: #fff; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 500 14px/1.3 "Inter Tight", system-ui, sans-serif; }
    h1 { font-size: 44px; letter-spacing: -0.04em; margin: 24px 24px 4px; font-weight: 900; }
    p.m { font: 500 10px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .5px; margin: 0 24px 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 24px; padding: 0 24px 48px; }
    .cell { position: relative; }
    .cell .cap { font: 500 10px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .pair svg, .pair canvas { width: 100%; aspect-ratio: 1; display: block; outline: 1px dashed rgba(31,60,255,.25); }
    .on-blue { background: var(--ink); }
    .row canvas { width: 100%; height: 220px; display: block; outline: 1px dashed rgba(31,60,255,.25); }
  </style>
</head>
<body>
  <h1>Specimen sheet</h1>
  <p class="m">Every figure in notarobot, as drawn (left) and as scanned (right). Dev page; not linked from the game.</p>
  <div class="grid" id="grid"></div>
  <div style="padding: 0 24px 48px" class="row">
    <div class="cap" style="font:500 10px 'JetBrains Mono';text-transform:uppercase;margin-bottom:6px">The six tiers, machine to human (white on blue)</div>
    <canvas id="tiers" class="on-blue"></canvas>
    <div class="cap" style="font:500 10px 'JetBrains Mono';text-transform:uppercase;margin:18px 0 6px">The subject, re-scanned at 0, 350 and 700 points</div>
    <canvas id="lattice" style="height:260px"></canvas>
  </div>
  <script type="module">
    import { FIGURES } from '../src/figures.js';
    import { SHAPES, LAYER_SHAPE } from '../src/shapes.js';
    import { Figure, samplePath, sampleGrid, combine, radiusFor } from '../src/specimen.js';

    const grid = document.getElementById('grid');
    for (const [name, f] of Object.entries(FIGURES)) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const [x, y, w, h] = f.box;
      const s = Math.max(w, h);
      cell.innerHTML = `<div class="cap">FIG. | ${name}</div><div class="pair">
        <svg viewBox="${x - (s - w) / 2} ${y - (s - h) / 2} ${s} ${s}"><path d="${f.d}" fill="#1F3CFF" fill-rule="evenodd"/>${f.grooves ? `<path d="${f.grooves}" fill="none" stroke="#fff" stroke-width="${f.groove}" stroke-linecap="round"/>` : ''}</svg>
        <canvas></canvas></div>`;
      grid.appendChild(cell);
      const canvas = cell.querySelector('canvas');
      const N = 4200;
      const fig = new Figure(canvas, { count: N, radius: radiusFor(N, 0.5), seed: name });
      fig.addShape(samplePath(N, f.d, { box: f.box, seed: name, grooves: f.grooves, groove: f.groove, porosity: f.porosity }));
      const W = canvas.clientWidth;
      Object.assign(fig.state, { x: W / 2, y: W / 2, size: W * 0.86 });
      fig.start();
    }

    // Tiers: square (grid), then the five organic shapes.
    const tiersCanvas = document.getElementById('tiers');
    const tf = new Figure(tiersCanvas, { count: 6 * 220, radius: 0.05, color: '#ffffff', seed: 'tiers' });
    const W = tiersCanvas.clientWidth;
    const H = tiersCanvas.clientHeight;
    const parts = [{ pts: sampleGrid(220, { w: 0.8, h: 0.8 }) }]
      .concat([1, 2, 3, 4, 5].map((k) => ({ pts: samplePath(220, SHAPES[LAYER_SHAPE[k]].d, { seed: `t${k}`, porosity: 0.08 + k * 0.05, drops: k === 5 ? 0.1 : 0.02 }) })))
      .map((p, i) => ({ ...p, x: (i - 2.5) * 1.25 }));
    tf.addShape(combine(parts));
    Object.assign(tf.state, { x: W / 2, y: H / 2, size: Math.min(W / 8, H * 0.7) });
    tf.radius = 0.06;
    tf.start();

    const lc = document.getElementById('lattice');
    const LW = lc.clientWidth;
    const LH = lc.clientHeight;
    const lf = new Figure(lc, { count: 3 * 900, radius: 0.03, seed: 'lat' });
    const bust = FIGURES.bust;
    lf.addShape(combine([0, 1, 2].map((i) => ({ pts: samplePath(900, bust.d, { box: bust.box, seed: `l${i}`, grooves: bust.grooves, groove: bust.groove }), x: (i - 1) * 1.15 }))));
    Object.assign(lf.state, { x: LW / 2, y: LH / 2, size: LH * 0.85, lattice: 0 });
    lf.start();
  </script>
</body>
</html>
